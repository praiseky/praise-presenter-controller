<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Praise Presenter Remote</title>

  <style>
    :root {
      --covenant-navy: #0B1B4D;
      --altar-cream: #F9F7F2;
      --kingdom-gold: #FFC72C;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--covenant-navy);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    #controllerFrame {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
      background: var(--altar-cream);
    }

    #loadingFallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
      background: var(--covenant-navy);
      text-align: center;
      z-index: 1;
    }

    .loading-card {
      max-width: 420px;
      border: 1px solid rgba(255, 199, 44, 0.65);
      border-radius: 18px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.32);
    }

    .loading-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .loading-text {
      font-size: 15px;
      line-height: 1.4;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div id="loadingFallback">
    <div class="loading-card">
      <div class="loading-title">Loading Praise Presenter Remote</div>
      <div class="loading-text">
        If this screen does not clear, check your internet connection and reload the page.
      </div>
    </div>
  </div>

  <iframe
    id="controllerFrame"
    title="Praise Presenter Remote"
    allow="fullscreen"
  ></iframe>

  <script>
    const GAS_CONTROLLER_BASE_URL =
      'https://script.google.com/macros/s/AKfycbzCNJCPWvcoThmbvTDDIkUVFhGq6-Cq4NQTrqX_eXTBfWdfBUFu2PqSaK6uPmLuemkbsA/exec?mode=controller';

    const frame = document.getElementById('controllerFrame');
    const fallback = document.getElementById('loadingFallback');

    const params = new URLSearchParams(window.location.search);
    const sessionId = String(params.get('session') || '').trim();

    const controllerUrl = new URL(GAS_CONTROLLER_BASE_URL);
    controllerUrl.searchParams.set('mode', 'controller');

    if (sessionId) {
      controllerUrl.searchParams.set('session', sessionId);
    }

    frame.addEventListener('load', function() {
      fallback.style.display = 'none';
    });

    frame.src = controllerUrl.toString();
  </script>
</body>
</html>
